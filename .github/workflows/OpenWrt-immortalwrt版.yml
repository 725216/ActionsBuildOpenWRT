name: OpenWrt-ImmortalWrt包含ssr
on:
  schedule:
    - cron: 0 21 * * *
  push:
    paths:
      - OpenWrt-immortalwrt.config
      - files/**
  workflow_dispatch:
    inputs:
      force_build:
        description: 强制编译（无视变更检测）
        required: false
        default: false
        type: boolean
      clean_cache:
        description: 清空缓存
        required: false
        default: false
        type: boolean
env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: OpenWrt-immortalwrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  COMPILE_THREAD: 2
  CACHE_KEY_VER: v1.3
  TZ: Asia/Shanghai
  TARGET_DIR: openwrt/bin/targets/mediatek/filogic
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 拉取仓库配置文件
        uses: actions/checkout@v6

      - name: 生成编译日期标签
        run: |
          echo "BUILD_TAG=build-$(date +%Y%m%d)_ssr-plus" >> $GITHUB_ENV
          echo "BUILD_DATETIME=$(date +%Y-%m-%d_%H-%M)" >> $GITHUB_ENV
        env:
          TZ: Asia/Shanghai

      - name: 安装OpenWrt编译完整依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison quilt libssl-dev xsltproc libxml2-utils \
          zstd device-tree-compiler python3 python3-ply python3-docutils libelf-dev ccache

      - name: 清理本地缓存
        if: github.event.inputs.clean_cache == 'true'
        run: |
          rm -rf openwrt .ccache build.log upstream_commit.txt last_commit.txt plugins_remote.txt plugins_last.txt plugin_changed_list.txt tmp_small_check || true
          echo "✅ 缓存清理完成"

      - name: 恢复编译缓存 dl + ccache + 插件哈希快照
        uses: actions/cache@v6
        with:
          path: |
            openwrt/dl
            .ccache
            last_commit.txt
            plugins_last.txt
          key: mt798x-6.6-${{ env.CACHE_KEY_VER }}
          restore-keys: |
            mt798x-6.6-${{ env.CACHE_KEY_VER }}

      - name: 校验源码目录
        run: |
          if [ -d openwrt ]; then
            cd openwrt
            REMOTE_URL=$(git remote get-url origin)
            CURRENT_BRANCH=$(git symbolic-ref --short HEAD)
            if [[ "${REMOTE_URL}" != "${{ env.REPO_URL }}" || "${CURRENT_BRANCH}" != "${{ env.REPO_BRANCH }}" ]]; then
              echo "⚠️ 目录分支不匹配，重建源码"
              cd ..
              rm -rf openwrt
            fi
          fi

      - name: 克隆/更新源码
        run: |
          if [ ! -d openwrt ]; then
            git clone --depth=1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          else
            cd openwrt
            git fetch origin --prune
            git reset --hard origin/${{ env.REPO_BRANCH }}
            git clean -df
          fi
          cd openwrt
          git rev-parse HEAD > ../upstream_commit.txt

      - name: 执行 diy-part1.sh
        run: |
          chmod +x ${{ env.DIY_P1_SH }}
          ./${{ env.DIY_P1_SH }}

      - name: 导入配置 + 执行 diy-part2.sh
        run: |
          cp ${{ env.CONFIG_FILE }} openwrt/.config
          chmod +x ${{ env.DIY_P2_SH }}
          ./${{ env.DIY_P2_SH }}
          cd openwrt
          make defconfig

      - name: 预下载源码包
        run: |
          cd openwrt
          make -j${{ env.COMPILE_THREAD }} download

      - name: 创建4G交换分区，防止OOM内存溢出
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 编译固件
        id: compile_firm
        run: |
          cd openwrt
          make -j${{ env.COMPILE_THREAD }} V=s 2>&1 | tee ../build.log
          echo "result=ok" >> $GITHUB_OUTPUT
          BOARD=$(grep CONFIG_TARGET_BOARD .config | cut -d'=' -f2 | tr -d '"')
          echo "BOARD=${BOARD}" >> $GITHUB_OUTPUT

      - name: 更新缓存快照
        if: steps.compile_firm.outputs.result == 'ok'
        run: |
          cp upstream_commit.txt last_commit.txt
          echo "✅ 快照已更新存入缓存"

      - name: 上传编译日志
        uses: actions/upload-artifact@v5
        if: steps.compile_firm.outputs.result == 'ok'
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 上传固件文件（Artifact）
        if: steps.compile_firm.outputs.result == 'ok'
        uses: actions/upload-artifact@v5
        with:
          name: OpenWrt-Firmware-${{ steps.compile_firm.outputs.BOARD }}
          path: |
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.manifest
          retention-days: 14

      - name: 上传完整bin目录到Artifact
        if: steps.compile_firm.outputs.result == 'ok'
        uses: actions/upload-artifact@v5
        with:
          name: All-Bin-Full-Directory
          path: openwrt/bin
          retention-days: 14

      - name: Prepare release artifacts（打包固件 + config.buildinfo）
        if: steps.compile_firm.outputs.result == 'ok'
        run: |
          mkdir -p release_out
          find ${{ env.TARGET_DIR }} -maxdepth 1 -type f \( -name "*.bin" -o -name "*.manifest" \) -exec cp {} release_out/ \;
          cp openwrt/bin/targets/mediatek/filogic/config.buildinfo release_out/
          ls -la release_out

      - name: 创建Release发布
        if: steps.compile_firm.outputs.result == 'ok'
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ env.BUILD_TAG }}
          name: OpenWrt-ImmortalWrt ${{ env.BUILD_DATETIME }}
          artifacts: release_out/*
          generateReleaseNotes: true
          allowUpdates: true

      - name: Retain latest 5 releases, remove older releases & tags
        if: steps.compile_firm.outputs.result == 'ok'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const reserveCount = 5;
            console.log(`设置保留最新 ${reserveCount} 个正式Release`);
            const { data: releases } = await github.rest.repos.listReleases({owner, repo, per_page: 100});
            const validReleases = releases.filter(item => !item.draft).sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
            const removeList = validReleases.slice(reserveCount);
            for (const release of removeList) {
              await github.rest.repos.deleteRelease({owner, repo, release_id: release.id});
              try {await github.rest.git.deleteRef({owner, repo, ref: `tags/${release.tag_name}`});}catch(e){}
            }
